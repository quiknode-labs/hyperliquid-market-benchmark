[package]
name = "hyperliquid-market-benchmark"
version = "0.2.0"
edition = "2024"
rust-version = "1.94"
description = "Transparent matched-cohort Hyperliquid book and trade delivery latency benchmark"
license = "Apache-2.0"
repository = "https://github.com/quiknode-labs/hyperliquid-market-benchmark"
homepage = "https://hyperliquid-market-benchmark-web.quicknode.workers.dev"
readme = "README.md"
publish = false

[[bin]]
name = "hyperliquid-market-benchmark"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
fs2 = "0.4"
prost = "0.14.4"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
rust_decimal = "1.42.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tonic = { version = "0.14.6", default-features = false, features = ["channel", "codegen", "tls-webpki-roots"] }
tonic-prost = "0.14.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
prost-build = "0.14.4"
protoc-bin-vendored = "3.2.0"
tonic-prost-build = "0.14.6"
