name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  BENCHMARK_SOURCE_COMMIT: ${{ github.sha }}

jobs:
  correctness:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.94.1 --profile minimal --component clippy,rustfmt
          rustup default 1.94.1

      - name: Reject private deployment material
        run: ./scripts/check-public-surface.sh

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Test every target with the locked graph
        run: cargo test --all-targets --locked

      - name: Deny compiler and Clippy warnings
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build the release binary
        run: cargo build --release --locked
