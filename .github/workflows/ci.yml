name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  BENCHMARK_SOURCE_COMMIT: ${{ github.sha }}

jobs:
  correctness:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.94.1 --profile minimal --component clippy,rustfmt
          rustup default 1.94.1

      - name: Install the portable Linux target
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          rustup target add x86_64-unknown-linux-musl

      - name: Reject private deployment material
        run: ./scripts/check-public-surface.sh

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Test every target with the locked graph
        run: cargo test --all-targets --locked

      - name: Deny compiler and Clippy warnings
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build the release binary
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-musl
          file target/x86_64-unknown-linux-musl/release/hyperliquid-market-benchmark | grep -E 'ELF 64-bit.*x86-64.*static'
