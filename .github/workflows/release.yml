name: Release Linux amd64 collector

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  BENCHMARK_SOURCE_COMMIT: ${{ github.sha }}

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.94.1 --profile minimal
          rustup default 1.94.1

      - name: Install the portable Linux target
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          rustup target add x86_64-unknown-linux-musl

      - name: Verify and build
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: |
          ./scripts/check-public-surface.sh
          cargo fmt --all --check
          cargo test --all-targets --locked
          cargo clippy --all-targets --locked -- -D warnings
          cargo build --release --locked --target x86_64-unknown-linux-musl
          file target/x86_64-unknown-linux-musl/release/hyperliquid-market-benchmark | grep -E 'ELF 64-bit.*x86-64.*static'

      - name: Package the collector and disclosures
        run: |
          install -d dist/package/hyperliquid-market-benchmark-linux-amd64
          install -m 0755 target/x86_64-unknown-linux-musl/release/hyperliquid-market-benchmark dist/hyperliquid-market-benchmark-linux-amd64
          install -m 0755 target/x86_64-unknown-linux-musl/release/hyperliquid-market-benchmark dist/package/hyperliquid-market-benchmark-linux-amd64/
          install -m 0644 LICENSE README.md dist/package/hyperliquid-market-benchmark-linux-amd64/
          cp -R docs dist/package/hyperliquid-market-benchmark-linux-amd64/
          tar -C dist/package -czf dist/hyperliquid-market-benchmark-linux-amd64.tar.gz hyperliquid-market-benchmark-linux-amd64
          (cd dist && sha256sum hyperliquid-market-benchmark-linux-amd64 > hyperliquid-market-benchmark-linux-amd64.sha256)
          (cd dist && sha256sum hyperliquid-market-benchmark-linux-amd64.tar.gz > hyperliquid-market-benchmark-linux-amd64.tar.gz.sha256)

      - name: Attest release provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4
        with:
          subject-path: |
            dist/hyperliquid-market-benchmark-linux-amd64
            dist/hyperliquid-market-benchmark-linux-amd64.sha256
            dist/hyperliquid-market-benchmark-linux-amd64.tar.gz
            dist/hyperliquid-market-benchmark-linux-amd64.tar.gz.sha256

      - name: Upload immutable workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hyperliquid-market-benchmark-linux-amd64
          path: |
            dist/hyperliquid-market-benchmark-linux-amd64
            dist/hyperliquid-market-benchmark-linux-amd64.sha256
            dist/hyperliquid-market-benchmark-linux-amd64.tar.gz
            dist/hyperliquid-market-benchmark-linux-amd64.tar.gz.sha256
          if-no-files-found: error

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/hyperliquid-market-benchmark-linux-amd64 \
            dist/hyperliquid-market-benchmark-linux-amd64.sha256 \
            dist/hyperliquid-market-benchmark-linux-amd64.tar.gz \
            dist/hyperliquid-market-benchmark-linux-amd64.tar.gz.sha256 \
            --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
